<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ishu Photo Frames | Customized Frames</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;text-align:center;padding:16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:25px}header p{margin:5px 0;color:#ddd;font-size:14px}
.wrap{max-width:1100px;margin:auto;padding:14px}.title{text-align:center;font-size:23px;margin:8px 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0002}.pic{height:300px;background:#eee}.pic img{width:100%;height:100%;object-fit:contain}.info{padding:12px}.info h2{font-size:17px;margin:0 0 6px}.price{font-size:23px;font-weight:700}.size{font-size:14px;color:#666;margin:5px 0}.btn{width:100%;padding:11px;border:0;border-radius:7px;background:#111;color:#fff;font-weight:bold;margin-top:8px}
#viewer{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:16px}.viewerbox{background:#fff;max-width:650px;height:100%;margin:auto;border-radius:12px;overflow:auto}.close{position:sticky;top:8px;float:right;margin:8px 10px;padding:7px 12px;border:0;border-radius:50%;font-size:20px;z-index:2}.big{height:55vh;background:#eee}.big img{width:100%;height:100%;object-fit:contain}.vinfo{padding:15px}.upload{margin-top:14px;padding:14px;border:2px dashed #bbb;border-radius:10px}.upload input{width:100%;margin-top:8px}.buy{background:#e21b23}.cart{background:#fff!important;color:#111!important;border:2px solid #111!important}
footer{background:#111;color:#fff;text-align:center;padding:25px;margin-top:25px}
@media(max-width:600px){.pic{height:220px}.info h2{font-size:15px}.price{font-size:20px}}
</style>
</head>
<body>
<header><h1>ISHU PHOTO FRAMES</h1><p>Customized Frames • Made With Your Memories ❤️</p></header>
<div class="wrap"><h2 class="title">Our Products</h2><div class="grid" id="products"></div></div>
<div id="viewer"><div class="viewerbox"><button class="close" onclick="closeViewer()">×</button><div class="big"><img id="vimg"></div><div class="vinfo"><h2 id="vtitle"></h2><div class="price" id="vprice"></div><div id="vsize" class="size"></div><div class="upload"><b>Upload Your Photos</b><p>अधिकतम 5 photos select करें</p><input id="customerPhotos" type="file" accept="image/*" multiple></div><button class="btn cart" onclick="addCart()">Add to Cart</button><button class="btn buy" onclick="buyNow()">Buy Now</button></div></div></div>
<footer><b>ISHU PHOTO FRAMES</b><p>Delivery Available Across India</p></footer>
<script>
const products=[
{title:'Personalized Calendar Photo Frame',size:'8×12 Inch',price:'₹399',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0000.jpg?v=2'},
{title:'Single Photo Frame',size:'12×18 Inch',price:'₹599',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0001.jpg?v=2'},
{title:'7 Horse Wall Clock',size:'12×18 Inch',price:'₹699',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0002.jpg?v=2'},
{title:'Premium Wall Clock',size:'12×12 Inch',price:'₹499',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0003.jpg?v=2'},
{title:'Personalized Milestone Photo Frame',size:'24×36 Inch',price:'₹1,999',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0004.jpg?v=2'},
{title:'Wedding / Anniversary Photo Frame',size:'18×24 Inch',price:'₹1,099',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0005.jpg?v=2'},
{title:'Family Photo Frame',size:'12×18 Inch',price:'₹599',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0006.jpg?v=2'},
{title:'Collage Photo Frame',size:'12×18 Inch',price:'₹599',img:'https://raw.githubusercontent.com/dineshchoudhary988711-dot/ISHU-PHOTOFRAMES/main/IMG-20260926-WA0007.jpg?v=2'}
];
const grid=document.getElementById('products');
products.forEach((p,i)=>{grid.innerHTML+=`<div class="card"><div class="pic"><img src="${p.img}" alt="${p.title}"></div><div class="info"><h2>${p.title}</h2><div class="price">${p.price}</div><div class="size">Size: ${p.size}</div><button class="btn" onclick="openViewer(${i})">View Product</button></div></div>`});
function openViewer(i){let p=products[i];document.getElementById('vimg').src=p.img;document.getElementById('vtitle').textContent=p.title;document.getElementById('vprice').textContent=p.price;document.getElementById('vsize').textContent='Size: '+p.size;document.getElementById('viewer').style.display='block'}
function closeViewer(){document.getElementById('viewer').style.display='none'}
document.getElementById('customerPhotos').addEventListener('change',function(){if(this.files.length>5){alert('Maximum 5 photos upload कर सकते हैं.');this.value=''}})
function addCart(){alert('Product added to cart!')}
function buyNow(){alert('Order page जल्द connect किया जाएगा.')}
</script>
</body>
</html>
