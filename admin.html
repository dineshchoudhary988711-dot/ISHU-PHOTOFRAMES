<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ishu Photo Frames - Admin Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#222}.top{background:#111;color:#fff;padding:18px}.top h1{margin:0;font-size:22px}.wrap{max-width:1100px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 8px #0001}.stat b{display:block;font-size:25px;margin-top:5px}.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.toolbar input,.toolbar select{padding:11px;border:1px solid #ccc;border-radius:8px}.orders{display:grid;gap:12px}.order{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 8px #0001}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:20px;background:#eee;font-size:12px}.money{font-size:18px;font-weight:bold}.empty{text-align:center;padding:40px;color:#777}.login{max-width:360px;margin:80px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 20px #0002}.login input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:bold}.danger{background:#c62828}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}
</style><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script></head>
<body>
<div id="login" class="login"><h2>ISHU PHOTO FRAMES</h2><p><b>Admin Login</b></p><input id="adminPin" inputmode="numeric" maxlength="4" placeholder="4-digit Admin Code"><button class="btn" style="width:100%;margin-top:8px" onclick="pinLogin()">Login</button><p id="err" style="color:#c00"></p></div>
<div id="app" style="display:none">
<div class="top"><div class="wrap"><button class="btn" style="float:right;background:#fff;color:#111" onclick="logout()">Logout</button><h1>ISHU PHOTO FRAMES — Admin Panel</h1><small>Live Firestore Order Management</small></div></div>
<div class="wrap">
<div class="stats"><div class="stat">Total Orders<b id="total">0</b></div><div class="stat">New<b id="new">0</b></div><div class="stat">Advance Collected<b id="advance">₹0</b></div><div class="stat">COD Pending<b id="cod">₹0</b></div><div class="stat">Visitors Today<b id="visToday">0</b></div><div class="stat">Last 7 Days<b id="vis7">0</b></div><div class="stat">Last 30 Days<b id="vis30">0</b></div><div class="stat">Total Visits<b id="visTotal">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Search name / mobile / order ID" oninput="render()"><select id="filter" onchange="render()"><option value="">All Status</option><option>New</option><option>Confirmed</option><option>Printing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option><option>Demo</option><button class="btn danger" onclick="clearDemo()">Clear Demo</button></select></div>
<div id="orders" class="orders"></div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDC0jnEYErbv6O6Ju7ujxJybPHwapCq5_0",authDomain:"ishu-photo-frames.firebaseapp.com",projectId:"ishu-photo-frames",storageBucket:"ishu-photo-frames.firebasestorage.app",messagingSenderId:"33113817139",appId:"1:33113817139:web:1c9849ec03659d70c0e346",measurementId:"G-478KNGZ168"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore(),auth=firebase.auth();
let liveOrders=[],unsubscribeOrders=null;const ADMIN_PIN=['2','4','6','8'].join('');
function pinLogin(){const pin=document.getElementById('adminPin').value.trim(),err=document.getElementById('err');if(pin===ADMIN_PIN){sessionStorage.setItem('ishuAdminPin','ok');show()}else err.textContent='Admin code गलत है।'}
function show(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';if(!unsubscribeOrders)listenOrders();loadVisitorStats()}
function logout(){if(unsubscribeOrders){unsubscribeOrders();unsubscribeOrders=null}sessionStorage.removeItem('ishuAdminPin');location.reload()}
if(sessionStorage.getItem('ishuAdminPin')==='ok')setTimeout(show,0);
function listenOrders(){unsubscribeOrders=db.collection('orders').orderBy('createdAt','desc').onSnapshot(s=>{liveOrders=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{document.getElementById('orders').innerHTML='<div class="empty">Firestore access error: '+escapeHtml(e.message)+'</div>'})}
function render(){let all=liveOrders,filter=document.getElementById('filter').value,q=document.getElementById('search').value.toLowerCase();let orders=all.filter(o=>(!filter||o.status===filter)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));document.getElementById('total').textContent=all.length;document.getElementById('new').textContent=all.filter(o=>o.status==='New'||o.status==='Confirmed').length;document.getElementById('advance').textContent='₹'+all.reduce((s,o)=>s+(+o.advance||0),0).toLocaleString('en-IN');document.getElementById('cod').textContent='₹'+all.reduce((s,o)=>s+(+o.cod||0),0).toLocaleString('en-IN');document.getElementById('orders').innerHTML=orders.map(o=>'<div class="order"><div class="row"><b>'+escapeHtml(o.id||'')+'</b><span class="badge">'+escapeHtml(o.status||'Confirmed')+'</span></div><p><b>'+escapeHtml(o.product||'')+'</b> — '+escapeHtml(o.size||'')+'</p><p>👤 '+escapeHtml(o.name||'')+' &nbsp; 📱 '+escapeHtml(o.phone||'')+'</p><p>📍 '+escapeHtml(o.address||'')+'</p><p class="money">Total ₹'+(+o.total||0)+' &nbsp; | &nbsp; Advance ₹'+(+o.advance||0)+' &nbsp; | &nbsp; COD ₹'+(+o.cod||0)+'</p><small>'+escapeHtml(o.paidAt||'')+'</small></div>').join('')||'<div class="empty">No orders found</div>'}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function clearDemo(){render()}
async function loadVisitorStats(){
 try{
  const snap=await db.collection('siteAnalytics').get(),days={};let total=0;
  snap.forEach(d=>{const x=d.data();if(d.id==='total')total=+x.visits||0;else days[d.id]=+x.visits||0});
  const today=new Date();const key=n=>{const d=new Date(today);d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
  let v7=0,v30=0;for(let i=0;i<30;i++){const v=days[key(i)]||0;if(i<7)v7+=v;v30+=v}
  document.getElementById('visToday').textContent=days[key(0)]||0;
  document.getElementById('vis7').textContent=v7;
  document.getElementById('vis30').textContent=v30;
  document.getElementById('visTotal').textContent=total;
 }catch(e){['visToday','vis7','vis30','visTotal'].forEach(id=>document.getElementById(id).textContent='—')}
}
</script></body></html>
